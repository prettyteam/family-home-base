<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kids' Shared Expenses</title>
<meta name="apple-mobile-web-app-title" content="Kids Expenses">
<meta name="theme-color" content="#f6e9e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Same look as Family Home Base: one centered column, a balance card on top, then the list. */
:root{
  --bg:#faf6f1; --surface:#ffffff; --ink:#2e2622; --muted:#7a6c63; --line:#ece2d8;
  --accent:#7d6350; --accent-ink:#ffffff; --accent-soft:#f6e9e4;
  --good:#2f7d5b; --good-soft:#e3f2ea; --warn:#a8670f; --warn-soft:#fbefd9; --bad:#b0353c; --bad-soft:#f9e1e2;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1714; --surface:#24201c; --ink:#f3ece4; --muted:#b5a99c; --line:#3a332c;
  --accent:#dcbfa6; --accent-ink:#2a1f17; --accent-soft:#3a2f27;
  --good:#71c79f; --good-soft:#1f3329; --warn:#e8b465; --warn-soft:#3a2e1a; --bad:#f08389; --bad-soft:#3d2224 }}
:root[data-theme="dark"]{
  --bg:#1a1714; --surface:#24201c; --ink:#f3ece4; --muted:#b5a99c; --line:#3a332c;
  --accent:#dcbfa6; --accent-ink:#2a1f17; --accent-soft:#3a2f27;
  --good:#71c79f; --good-soft:#1f3329; --warn:#e8b465; --warn-soft:#3a2e1a; --bad:#f08389; --bad-soft:#3d2224 }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font:600 30px/1.1 var(--display);margin:6px 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;cursor:pointer;min-height:40px}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
/* Balance */
.balance .label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.balance .big{font:600 46px/1.05 var(--display);margin:4px 0 12px}
.lines{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px;font-size:15px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines span:first-child{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
/* Filters */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.month{font:500 italic 19px var(--display);margin:22px 2px 8px;color:var(--muted)}
/* Items */
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item .what{font-weight:600}
.item .meta{color:var(--muted);font-size:14px;margin-top:2px}
.item .amt{text-align:right;white-space:nowrap}
.item .half{font-weight:600;font-size:18px}
.item .full{color:var(--muted);font-size:13px}
.item .note{font-size:14px;color:var(--muted);margin-top:6px;font-style:italic}
.item .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;margin-right:4px}
.tag.Owed{background:var(--warn-soft);color:var(--warn)}
.tag.Paid{background:var(--good-soft);color:var(--good)}
.tag.Declined{background:var(--bad-soft);color:var(--bad)}
.tag.by{background:var(--accent-soft);color:var(--accent)}
.item.Paid .half,.item.Declined .half{text-decoration:line-through;color:var(--muted);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* Sheets (form + receipt viewer) */
.veil{position:fixed;inset:0;background:rgba(20,14,10,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font:600 24px var(--display);margin:0 0 14px}
.field{display:grid;gap:5px;margin-bottom:13px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-size:15px}
.split b{font-size:18px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}
.drop img{max-width:100%;max-height:180px;border-radius:10px;display:block;margin:0 auto 8px}
.foot{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.foot .right{display:flex;gap:10px;margin-left:auto}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin-top:6px}
.viewer img{width:100%;border-radius:12px;display:block}
.viewer iframe{width:100%;height:70vh;border:0;border-radius:12px;background:#fff}
/* Passcode */
.gate{max-width:380px;margin:12vh auto 0;text-align:center}
.gate input{text-align:center;letter-spacing:.2em;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
/* Tabs, category dropdowns, older items, calendar */
.tabs{display:flex;gap:4px;background:var(--accent-soft);border-radius:999px;padding:4px;margin:0 0 16px}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .15s}
details.cat[open] summary::after{transform:rotate(-135deg)}
.cname{font:600 20px var(--display)}
.ccount{color:var(--muted);font-size:14px}
.csum{margin-left:auto;font-weight:600;font-size:17px}
.cbody{padding:0 12px 12px}
.cbody .item{border-color:var(--line);background:var(--bg)}
.oldhead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:12px 4px 4px}
.old{display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.old:last-child{border-bottom:0}
.old .what{font-weight:500}
.old .meta{color:var(--muted);font-size:13px}
.old .half{font-weight:600;white-space:nowrap}
.ev{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.evtime{min-width:64px;color:var(--muted);font-size:14px;padding-top:2px}
.ev .what{font-weight:600}
.ev .meta{color:var(--muted);font-size:14px;margin-top:3px}
.tag.t-Medical{background:var(--bad-soft);color:var(--bad)}
.tag.t-School{background:var(--accent-soft);color:var(--accent)}
.tag.t-Activity{background:var(--good-soft);color:var(--good)}
.hide{display:none!important}
/* Home: greeting, MENU between two fine lines, then plain squares two across (same as Family Home Base and the salon apps) */
.home{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 8px}
.hhi{display:flex;flex-direction:column;align-items:center;font-family:var(--display);line-height:1.05}
.hhi span:first-child{font-size:20px;color:var(--muted)}
.hhi .hname{font-size:40px;color:var(--ink)}
.hdate{margin:0;color:var(--muted);font-size:13px;letter-spacing:.04em}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.hbal{margin:6px 0 0;text-align:center;font-family:var(--display);font-style:italic;font-size:18px;color:var(--accent)}
.mhead{display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-top:10px}
.mhead::before,.mhead::after{content:"";width:28px;height:1px;background:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(124px,150px));gap:8px;justify-content:center}
.cgrid>button,.cgrid>a{background:var(--surface);color:var(--ink);border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:-6px;border-radius:0;aspect-ratio:1/1;font-family:var(--display);font-size:16px;line-height:1.2;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
.cgrid small{font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="veil" id="formVeil"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <h2 id="formTitle">Add an expense</h2>
  <form id="form" autocomplete="off">
    <div class="field"><label for="fWhat">What was it for?</label><input id="fWhat" placeholder="e.g. School sneakers" required></div>
    <div class="two">
      <div class="field"><label for="fDate">Date paid</label><input id="fDate" type="date" required></div>
      <div class="field"><label for="fFull">Full amount you paid</label><input id="fFull" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" required></div>
    </div>
    <div class="split" id="fSplit">John's half: <b class="num">$0.00</b></div>
    <div class="two">
      <div class="field"><label for="fChild">For</label><select id="fChild"></select></div>
      <div class="field"><label for="fCat">Type</label><select id="fCat"><option>Medical</option><option>School</option><option>Activities</option><option>Other</option></select></div>
    </div>
    <div class="field" id="fStatusWrap"><label for="fStatus">Status</label><select id="fStatus"><option>Owed</option><option>Paid</option><option value="Declined">Declined (John said no)</option></select></div>
    <div class="field"><label for="fNote">Note for John (optional)</label><input id="fNote" placeholder="e.g. Copay after insurance"></div>
    <div class="field"><label>Receipt</label>
      <div class="drop" id="fDrop" tabindex="0" role="button">Tap to add a photo or PDF of the receipt</div>
      <input id="fFile" type="file" accept="image/*,application/pdf" class="hide">
    </div>
    <div class="err" id="fErr"></div>
    <div class="foot">
      <button type="button" class="btn danger" id="fDelete">Delete</button>
      <div class="right"><button type="button" class="btn ghost" id="fCancel">Cancel</button><button type="submit" class="btn primary" id="fSave">Save</button></div>
    </div>
  </form>
</div></div>

<div class="veil" id="viewVeil"><div class="sheet viewer" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
  <h2 id="viewTitle">Receipt</h2>
  <div id="viewBody"></div>
  <div class="foot"><a class="btn ghost" id="viewOpen" target="_blank" rel="noopener">Open full size</a><button class="btn primary" id="viewClose">Close</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* Data lives in the KIDS 2026 Google Sheet ("Expense Log" tab) through a small Apps Script.
   Paste the script's Web app URL here after deploying it (see README). */
const API_URL = "https://script.google.com/macros/s/AKfycbxSK3Wa1ZJRkJOUbnqVyQD4bA5u7Rk_4OorJGn56U7l0HlHXWWwhV-zV0LEcg-Fq4J0/exec";
const PIN_KEY = "kx_pin";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const half = n => Math.round(Number(n || 0) * 50) / 100;
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const niceDate = s => s ? new Date(s + "T12:00").toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}) : "";
const monthOf = s => s ? new Date(s + "T12:00").toLocaleDateString("en-US", {month:"long", year:"numeric"}) : "No date";

let S = { role:null, items:[], oldBalance:null, oldItems:[], upcoming:[], kids:[], filter:"Owed", child:"All", type:"All", tab:"home", open:{}, editing:null, file:null };
let pin = ""; try { pin = localStorage.getItem(PIN_KEY) || ""; } catch (e) {}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- talking to the Sheet ---------- */
async function api(body){
  if (window.DEMO) return window.DEMO(body);
  if (!API_URL) throw new Error("This site isn't connected to the Sheet yet.");
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({pin}, body))});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}

async function load(){
  try {
    const j = await api({action:"list"});
    Object.assign(S, {role:j.role, items:j.items || [], oldBalance:j.oldBalance, oldItems:j.oldItems || [], upcoming:j.upcoming || [], kids:j.kids || []});
    try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
    render();
  } catch (e) {
    if (e.message === "bad_pin" || e.message === "locked" || !pin) return gate(e.message);
    $("#app").innerHTML = `<div class="gate"><h1>Kids' Shared Expenses</h1><p class="sub">${esc(e.message)}</p><button class="btn" onclick="load()">Try again</button></div>`;
  }
}

function gate(why){
  const msg = why === "locked" ? "Too many tries. Please wait 15 minutes." : why === "bad_pin" ? "That passcode didn't match." : "Enter your passcode to see the list.";
  $("#app").innerHTML = `<form class="gate" id="gate"><h1>Kids' Shared Expenses</h1><p class="sub">${msg}</p>
    <div class="field"><input id="pin" type="password" inputmode="text" autocomplete="current-password" aria-label="Passcode" autofocus></div>
    <button class="btn primary" style="width:100%">Open</button></form>`;
  $("#gate").onsubmit = e => { e.preventDefault(); pin = $("#pin").value.trim(); load(); };
}

/* ---------- the page ---------- */
const CATS = ["Medical", "School", "Activities", "Other"];
const catOf = c => CATS.indexOf(c) >= 0 ? c : "Other";
const kidOk = k => S.child === "All" || !k || k === S.child || k === "Both";

/* Items Alexandra paid: John owes half. Items John paid (paidBy "John"): Alexandra owes half. "all" is what's left after netting the two. */
const byJohn = i => i.paidBy === "John";
function totals(){
  const owed = S.items.filter(i => i.status === "Owed" && !byJohn(i)), his = S.items.filter(i => i.status === "Owed" && byJohn(i));
  const year = String(new Date().getFullYear());
  const open = owed.reduce((a, i) => a + i.half, 0), alexOwes = his.reduce((a, i) => a + i.half, 0);
  const earlier = S.oldBalance != null ? S.oldBalance : S.oldItems.reduce((a, i) => a + i.amount, 0);
  const johnOwes = open + (earlier || 0);
  return {
    count: owed.length, open, earlier, johnOwes, alexOwes, hisCount: his.length,
    all: johnOwes - alexOwes,
    paidYear: S.items.filter(i => i.status === "Paid" && !byJohn(i) && (i.paidOn || i.date).slice(0,4) === year).reduce((a, i) => a + i.half, 0),
    spentYear: S.items.filter(i => i.status !== "Declined" && i.date.slice(0,4) === year).reduce((a, i) => a + i.full, 0)
  };
}

const mine = (i, owner) => owner || byJohn(i);
const noLabel = i => byJohn(i) ? "Alexandra said no" : "John said no";
function itemHtml(i, owner){
  const can = mine(i, owner);
  return `<article class="item ${esc(i.status)}">
      <div class="top">
        <div><div class="what">${esc(i.what)}</div>
          <div class="meta">${niceDate(i.date)} · ${esc(i.child || "Both")}</div></div>
        <div class="amt num"><div class="half">${fmt(i.half)}</div><div class="full">of ${fmt(i.full)}</div></div>
      </div>
      ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
      <div class="row">
        ${byJohn(i) ? `<span class="tag by">Paid by John</span>` : ""}<span class="tag ${esc(i.status)}">${i.status === "Declined" ? noLabel(i) : esc(i.status)}${i.status === "Paid" && i.paidOn ? " " + niceDate(i.paidOn).replace(/, \d{4}$/, "") : ""}</span>
        <button class="btn small" data-receipt="${esc(i.id)}" ${i.hasReceipt ? "" : "disabled"}>${i.hasReceipt ? "View receipt" : "No receipt"}</button>
        ${can ? `<button class="btn small ghost" data-paid="${esc(i.id)}">${i.status === "Paid" ? "Mark owed" : "Mark paid"}</button>
                   <button class="btn small ghost" data-edit="${esc(i.id)}">Edit</button>` : ""}
      </div></article>`;
}

function oldHtml(o){
  return `<div class="old"><div><div class="what">${esc(o.what)}</div><div class="meta">${esc(o.kid || "Both")} · from the KIDS 2026 sheet</div></div><div class="half num">${fmt(o.amount)}</div></div>`;
}

function expensesHtml(owner){
  const t = totals(), year = new Date().getFullYear();
  const items = S.items.filter(i => (S.filter === "All" || i.status === S.filter) && kidOk(i.child)).sort((a, b) => b.date.localeCompare(a.date));
  const olds = (S.filter === "Owed" || S.filter === "All") ? S.oldItems.filter(o => kidOk(o.kid)) : [];
  let html = `<section class="card balance" aria-label="Balance">
      <div class="label">${balLabel(t, owner)}</div>
      <div class="big num">${fmt(Math.abs(t.all))}</div>
      <div class="lines num">
        ${t.earlier ? `<div><span>From the KIDS 2026 sheet (${S.oldItems.length || "earlier"} items)</span><span>${fmt(t.earlier)}</span></div>` : ""}
        <div><span>Alexandra paid, added here (${t.count})</span><span>${fmt(t.open)}</span></div>
        ${t.hisCount || t.alexOwes ? `<div><span>John paid, Alexandra's half (${t.hisCount})</span><span>−${fmt(t.alexOwes)}</span></div>` : ""}
        <div><span>Paid back in ${year}</span><span>${fmt(t.paidYear)}</span></div>
        <div><span>Total spent on the boys in ${year}</span><span>${fmt(t.spentYear)}</span></div>
      </div>
    </section>
    <div class="actions"><button class="btn primary" id="addBtn">+ ${owner ? "Add an expense" : "Add an expense you paid"}</button></div>
    <div class="chips" role="group" aria-label="Show">${["Owed","Paid","Declined","All"].map(f => `<button class="chip" data-f="${f}" aria-pressed="${S.filter===f}">${f === "Declined" ? "Said no" : f}</button>`).join("")}</div>
    ${kidChips()}`;
  if (!items.length && !olds.length) return html + `<div class="empty">${S.filter === "Owed" ? "Nothing owed right now." : "Nothing here yet."}</div>`;
  CATS.forEach(c => {
    const mine = items.filter(i => catOf(i.category) === c), old = olds.filter(o => catOf(o.category) === c);
    if (!mine.length && !old.length) return;
    const sum = mine.reduce((a, i) => a + (byJohn(i) ? -i.half : i.half), 0) + old.reduce((a, o) => a + o.amount, 0), n = mine.length + old.length;
    html += `<details class="cat" data-cat="${c}" ${S.open[c] ? "open" : ""}>
      <summary><span class="cname">${c}</span><span class="ccount">${n} item${n === 1 ? "" : "s"}</span><span class="csum num">${sum < 0 ? "−" + fmt(-sum) : fmt(sum)}</span></summary>
      <div class="cbody">${mine.map(i => itemHtml(i, owner)).join("")}
        ${old.length ? `<div class="oldhead">From the KIDS 2026 sheet</div>${old.map(oldHtml).join("")}` : ""}</div>
    </details>`;
  });
  return html;
}

function balLabel(t, owner){
  if (Math.abs(t.all) < 0.005) return "All square";
  if (t.all > 0) return owner ? "John still owes" : "You still owe Alexandra";
  return owner ? "You owe John" : "Alexandra owes you";
}

function kidChips(){
  return S.kids.length > 1 ? `<div class="chips" role="group" aria-label="Child" style="margin-top:0">${["All"].concat(S.kids).map(k => `<button class="chip" data-k="${esc(k)}" aria-pressed="${S.child===k}">${k === "All" ? "Both boys" : esc(k)}</button>`).join("")}</div>` : "";
}

function upcomingHtml(){
  const list = S.upcoming.filter(e => (S.type === "All" || e.type === S.type) && kidOk(e.kid));
  let html = `<p class="sub" style="margin-top:4px">The boys' appointments, school days off and activities for the next 6 weeks, from the family calendar.</p>
    <div class="chips" role="group" aria-label="Type">${["All","Medical","School","Activity"].map(f => `<button class="chip" data-t="${f}" aria-pressed="${S.type===f}">${f === "Activity" ? "Activities" : f}</button>`).join("")}</div>
    ${kidChips()}`;
  if (!list.length) return html + `<div class="empty">Nothing coming up.</div>`;
  let day = "";
  list.forEach(e => {
    const s = new Date(e.start), d = e.allDay ? new Date(e.start.slice(0,10) + "T12:00") : s;
    const label = d.toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric"});
    if (label !== day) { day = label; html += `<div class="month">${label}</div>`; }
    const time = e.allDay ? "All day" : s.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
    html += `<div class="ev"><div class="evtime num">${time}</div><div class="evmain"><div class="what">${esc(e.title)}</div>
      <div class="meta"><span class="tag t-${esc(e.type)}">${esc(e.type)}</span> ${[e.kid, e.location].filter(Boolean).map(esc).join(" · ")}</div></div></div>`;
  });
  return html;
}

/* Home: hello, the date, what's owed, then the menu squares */
function homeHtml(owner){
  const d = new Date(), t = totals(), now = Date.now();
  const catSum = c => S.items.filter(i => i.status === "Owed" && catOf(i.category) === c).reduce((a, i) => a + (byJohn(i) ? -i.half : i.half), 0)
                    + S.oldItems.filter(o => catOf(o.category) === c).reduce((a, o) => a + o.amount, 0);
  const next = S.upcoming.find(e => new Date(e.allDay ? e.start.slice(0,10) + "T23:59" : e.start).getTime() >= now);
  const nextLabel = next ? (e => { const x = e.allDay ? new Date(e.start.slice(0,10) + "T12:00") : new Date(e.start);
    return x.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}) + " · " + e.title; })(next) : "Nothing in the next 6 weeks";
  const sq = (attrs, label, sub) => `<button type="button" ${attrs}><span>${esc(label)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</button>`;
  const tiles = [sq('data-go="money"', "Expenses", balLabel(t, owner).replace("still ", "") + (Math.abs(t.all) < 0.005 ? "" : " " + fmt(Math.abs(t.all)))),
    sq('data-go="add"', "Add an expense", owner ? "Photo of the receipt" : "One you paid"),
    sq('data-go="cal"', "Coming up", nextLabel)]
    .concat(CATS.map(c => sq(`data-go="money" data-opencat="${c}"`, c, (v => Math.abs(v) < 0.005 ? "Nothing owed" : (v < 0 ? "−" : "") + fmt(Math.abs(v)))(catSum(c)))))
    .concat(owner ? [`<a href="../"><span>Family Home Base</span><small>Back to the home app</small></a>`] : []);
  return `<section class="home">
    <div class="hhi"><span>Hello,</span><span class="hname">${owner ? "Alexandra" : "John"}</span></div>
    <p class="hdate">${d.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"})} · <button type="button" class="linkbtn" id="signOut">Not ${owner ? "Alexandra" : "John"}? Sign out</button></p>
    <p class="hbal">${esc(balLabel(t, owner))}${Math.abs(t.all) < 0.005 ? "" : `: <span class="num">${fmt(Math.abs(t.all))}</span>`}</p>
    <div class="mhead">Menu</div>
    <div class="cgrid">${tiles.filter(Boolean).join("")}</div>
  </section>`;
}

function render(){
  const owner = S.role === "owner";
  let html = `<h1>Kids' Shared Expenses</h1>
    ${S.tab === "home" ? "" : `<p class="sub">${owner ? "Everything is split 50/50. Enter the full amount and the half is worked out for you." : "Costs for the boys, split 50/50. Add what you paid with its receipt, and each item shows the half owed."}</p>`}
    <div class="tabs" role="tablist" ${S.tab === "home" ? 'style="margin-top:14px"' : ""}>
      <button role="tab" class="tab" data-tab="home" aria-selected="${S.tab==="home"}">Home</button>
      <button role="tab" class="tab" data-tab="money" aria-selected="${S.tab==="money"}">Expenses</button>
      <button role="tab" class="tab" data-tab="cal" aria-selected="${S.tab==="cal"}">Coming up</button>
    </div>`;
  html += S.tab === "home" ? homeHtml(owner) : S.tab === "cal" ? upcomingHtml() : expensesHtml(owner);
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    if (b.dataset.go === "add") return openForm(null);
    if (b.dataset.opencat) { S.open = {}; S.open[b.dataset.opencat] = true; S.filter = "Owed"; }
    S.tab = b.dataset.go; render(); window.scrollTo(0, 0);
  });
  const out = $("#signOut"); if (out) out.onclick = () => { try { localStorage.removeItem(PIN_KEY); } catch (e) {} pin = ""; S.role = null; gate(); };
  const add = $("#addBtn"); if (add) add.onclick = () => openForm(null);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.type = b.dataset.t; render(); });
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { S.child = b.dataset.k; render(); });
  document.querySelectorAll("details.cat").forEach(d => d.ontoggle = () => { S.open[d.dataset.cat] = d.open; });
  document.querySelectorAll("[data-receipt]").forEach(b => b.onclick = () => viewReceipt(b.dataset.receipt));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openForm(b.dataset.edit));
  document.querySelectorAll("[data-paid]").forEach(b => b.onclick = () => togglePaid(b.dataset.paid, b));
}

/* ---------- add / edit ---------- */
function openForm(id){
  const it = id ? S.items.find(i => i.id === id) : null;
  S.editing = it; S.file = null;
  const owner = S.role === "owner", his = it ? byJohn(it) : !owner;
  $("#formTitle").textContent = it ? "Edit expense" : owner ? "Add an expense" : "Add an expense you paid";
  $("#fSplit").firstChild.textContent = his ? "Alexandra's half: " : "John's half: ";
  document.querySelector('label[for="fNote"]').textContent = his ? "Note for Alexandra (optional)" : "Note for John (optional)";
  $("#fStatus").options[2].textContent = his ? "Declined (Alexandra said no)" : "Declined (John said no)";
  $("#fChild").innerHTML = ["Both"].concat(S.kids).map(k => `<option value="${esc(k)}">${k === "Both" ? "Both boys" : esc(k)}</option>`).join("");
  $("#fWhat").value = it ? it.what : "";
  $("#fDate").value = it ? it.date : today();
  $("#fFull").value = it ? it.full : "";
  $("#fChild").value = it ? (it.child || "Both") : "Both";
  $("#fCat").value = it ? it.category : "Medical";
  $("#fStatus").value = it ? it.status : "Owed";
  $("#fNote").value = it ? it.note : "";
  $("#fStatusWrap").classList.toggle("hide", !it || (!owner && !his));
  $("#fDelete").classList.toggle("hide", !it);
  $("#fDrop").innerHTML = it && it.hasReceipt ? "Receipt saved. Tap to replace it." : "Tap to add a photo or PDF of the receipt";
  $("#fErr").textContent = "";
  $("#fFile").value = "";
  updateSplit();
  $("#formVeil").classList.add("open");
  setTimeout(() => $("#fWhat").focus(), 50);
}
function closeForm(){ $("#formVeil").classList.remove("open"); }
function updateSplit(){ $("#fSplit b").textContent = fmt(half($("#fFull").value)); }

/* Photos are shrunk on the phone before upload so they send fast and stay readable. */
function shrink(file){
  return new Promise((ok, bad) => {
    if (file.type === "application/pdf") {
      const r = new FileReader(); r.onload = () => ok({mime:file.type, b64:String(r.result).split(",")[1], preview:null}); r.onerror = bad; r.readAsDataURL(file); return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL("image/jpeg", .82); URL.revokeObjectURL(url);
      ok({mime:"image/jpeg", b64:data.split(",")[1], preview:data});
    };
    img.onerror = () => bad(new Error("That photo couldn't be read. Try a screenshot or a PDF."));
    img.src = url;
  });
}

$("#fFull").addEventListener("input", updateSplit);
$("#fDrop").onclick = () => $("#fFile").click();
$("#fDrop").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#fFile").click(); } };
$("#fFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("#fDrop").textContent = "Getting the receipt ready…";
  try {
    S.file = await shrink(f);
    $("#fDrop").innerHTML = S.file.preview ? `<img src="${S.file.preview}" alt="Receipt preview">Tap to change` : `📄 ${esc(f.name)} · Tap to change`;
  } catch (err) { S.file = null; $("#fDrop").textContent = err.message; }
};
$("#fCancel").onclick = closeForm;
$("#formVeil").onclick = e => { if (e.target.id === "formVeil") closeForm(); };
$("#form").onsubmit = async e => {
  e.preventDefault();
  const it = S.editing, save = $("#fSave");
  const data = { what:$("#fWhat").value, date:$("#fDate").value, full:$("#fFull").value, child:$("#fChild").value, category:$("#fCat").value,
                 status: it ? $("#fStatus").value : "Owed", note:$("#fNote").value, paidOn: it && it.status === "Paid" ? it.paidOn : "" };
  save.disabled = true; save.textContent = S.file ? "Uploading…" : "Saving…"; $("#fErr").textContent = "";
  try {
    await api({action: it ? "update" : "add", id: it && it.id, data, receipt: S.file && {mime:S.file.mime, b64:S.file.b64}});
    closeForm(); toast(it ? "Saved" : `Added. ${S.role === "owner" ? "John's" : "Alexandra's"} half is ${fmt(half(data.full))}`); await load();
  } catch (err) { $("#fErr").textContent = err.message; }
  finally { save.disabled = false; save.textContent = "Save"; }
};
$("#fDelete").onclick = async () => {
  const it = S.editing; if (!it || !confirm(`Delete "${it.what}"? Its receipt is deleted too.`)) return;
  try { await api({action:"delete", id:it.id}); closeForm(); toast("Deleted"); await load(); }
  catch (err) { $("#fErr").textContent = err.message; }
};

async function togglePaid(id, btn){
  const it = S.items.find(i => i.id === id); if (!it) return;
  btn.disabled = true;
  const paid = it.status !== "Paid";
  try {
    await api({action:"update", id, data: Object.assign({}, it, {status: paid ? "Paid" : "Owed", paidOn: paid ? today() : ""})});
    toast(paid ? "Marked paid" : "Back to owed"); await load();
  } catch (err) { btn.disabled = false; toast(err.message); }
}

/* ---------- receipts ---------- */
let viewUrl = null;
async function viewReceipt(id){
  const it = S.items.find(i => i.id === id);
  $("#viewTitle").textContent = it ? it.what : "Receipt";
  $("#viewBody").innerHTML = `<div class="empty">Loading the receipt…</div>`;
  $("#viewOpen").classList.add("hide");
  $("#viewVeil").classList.add("open");
  try {
    const j = await api({action:"receipt", id});
    const bytes = Uint8Array.from(atob(j.b64), c => c.charCodeAt(0));
    if (viewUrl) URL.revokeObjectURL(viewUrl);
    viewUrl = URL.createObjectURL(new Blob([bytes], {type:j.mime}));
    $("#viewBody").innerHTML = j.mime === "application/pdf" ? `<iframe src="${viewUrl}" title="Receipt"></iframe>` : `<img src="${viewUrl}" alt="Receipt for ${esc(it ? it.what : "")}">`;
    $("#viewOpen").href = viewUrl; $("#viewOpen").classList.remove("hide");
  } catch (err) { $("#viewBody").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}
$("#viewClose").onclick = () => $("#viewVeil").classList.remove("open");
$("#viewVeil").onclick = e => { if (e.target.id === "viewVeil") $("#viewVeil").classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeForm(); $("#viewVeil").classList.remove("open"); } });

if (pin || window.DEMO) load(); else gate();
</script>
